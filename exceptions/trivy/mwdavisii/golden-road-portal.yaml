# Platform exceptions to the Trivy scan of mwdavisii/golden-road-portal, and of no other repository. Owned by this repo, never by
# the app: an app's own .trivyignore is never read. Every entry needs a statement (why it is safe for now, and what ends it)
# and an expired_at date. After that date Trivy reports the finding again by itself, so a forgotten exception fails closed.
# Remove the entry when its fix lands.
vulnerabilities:
  - id: CVE-2026-76844
    statement: >-
      zlib (zlib1g 1:1.3.dfsg+really1.3.1-1+b1) in the platform's Debian 13 Python base, python:3.12-slim-trixie@sha256:4840d514
      (builder 0.7.1). Debian fixed it in 1:1.3.dfsg+really1.3.1-1+deb13u1, but no python:3.12-slim-trixie image carries the
      fix yet (checked 2026-11-16), so the app team cannot fix it. Accepted by the platform owner as a short, dated
      exception, not as a finding that is unreachable. Remove this entry when the builder pins a base image with deb13u1.
    expired_at: 2026-11-30
  - id: CVE-2026-85091
    statement: >-
      zlib (zlib1g 1:1.3.dfsg+really1.3.1-1+b1) in the platform's Debian 13 Python base, python:3.12-slim-trixie@sha256:4840d514
      (builder 0.7.1). Same package and same Debian fix (1:1.3.dfsg+really1.3.1-1+deb13u1) as CVE-2026-76844, not yet in any
      python:3.12-slim-trixie image (checked 2026-11-16). Accepted by the platform owner as a short, dated exception. Remove
      this entry when the builder pins a base image with deb13u1.
    expired_at: 2026-11-30
